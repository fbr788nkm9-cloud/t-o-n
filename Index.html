<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theo dõi đơn hàng</title>
<style>
:root{--bg:#f4f8ff;--card:#fff;--tx:#1f2a44;--mut:#6b7794;--pri:#4f8cff;--pri2:#e8f0ff;--bd:#dbe5f7;--ok:#22a06b;--okbg:#e4f7ee;--wait:#d98a00;--waitbg:#fff4dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--tx:#e8edfa;--mut:#9aa6c4;--pri2:#26335a;--bd:#2f3b63;--okbg:#17352a;--waitbg:#3a2f12}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:1.5rem;margin:8px 0 14px;color:var(--pri)}
.back{display:block;text-align:center;padding:10px;border-radius:12px;background:var(--pri2);color:var(--pri);font-weight:700;text-decoration:none;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
input:focus{outline:2px solid var(--pri);border-color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:1.15rem;color:var(--pri)}
.stat span{font-size:.72rem;color:var(--mut)}
.chips{display:flex;gap:8px;margin-bottom:12px}
.chips button{flex:1;padding:8px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mut);font-weight:600;cursor:pointer}
.chips button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.head small{color:var(--mut);display:block}
.tag{font-size:.75rem;padding:4px 10px;border-radius:99px;font-weight:700;white-space:nowrap}
.tag.w{background:var(--waitbg);color:var(--wait)}.tag.d{background:var(--okbg);color:var(--ok)}
.steps{display:flex;margin:16px 0 8px}
.st{flex:1;text-align:center;font-size:.72rem;color:var(--mut);position:relative}
.st i{display:block;width:24px;height:24px;line-height:24px;border-radius:50%;background:var(--bd);color:#fff;font-style:normal;margin:0 auto 4px;position:relative;z-index:1;font-size:.8rem}
.st:not(:last-child)::after{content:"";position:absolute;top:11px;left:50%;width:100%;height:3px;background:var(--bd)}
.st.on{color:var(--tx);font-weight:600}.st.on i{background:var(--pri)}
.st.on:not(:last-child).lnk::after{background:var(--pri)}
.st.fin i{background:var(--ok)}
.ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--bd);font-size:.88rem}
.ln span:first-child{color:var(--mut);flex:none}.ln span:last-child{text-align:right;font-weight:600;word-break:break-word}
.btn{width:100%;margin-top:10px;padding:11px;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:700;font-size:.95rem;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.eta{font-size:.82rem;color:var(--mut);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔎 Theo dõi đơn hàng</h1>
  <a class="back" href="./">← Quay lại tạo đơn</a>
  <input id="q" type="search" placeholder="Nhập mã hàng, tên hoặc SĐT để tìm..." oninput="render()">
  <div class="stats">
    <div class="stat"><b id="s1">0</b><span>Tổng đơn</span></div>
    <div class="stat"><b id="s2">0</b><span>Chờ nhận</span></div>
    <div class="stat"><b id="s3">0 đ</b><span>Tổng tiền</span></div>
  </div>
  <div class="chips">
    <button id="f0" class="on" onclick="setF(0)">Tất cả</button>
    <button id="f1" onclick="setF(1)">Chờ nhận</button>
    <button id="f2" onclick="setF(2)">Đã nhận</button>
  </div>
  <div id="list"></div>
</div>
<script>
var orders=[],flt=0;
function load(){try{orders=JSON.parse(localStorage.getItem("orders")||"[]")}catch(e){orders=[]}}
function save(){try{localStorage.setItem("orders",JSON.stringify(orders))}catch(e){}}
function $(i){return document.getElementById(i)}
function money(n){return Number(n).toLocaleString("vi-VN")+" đ"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function setF(n){flt=n;for(var i=0;i<3;i++)$("f"+i).className=i==n?"on":"";render()}
function daysLeft(d2){var p=d2.split("/"),t=new Date(p[2],p[1]-1,p[0]),n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function eta(o){if(o.done)return"Đơn đã được giao thành công";var d=daysLeft(o.d2);return d>0?"Dự kiến nhận sau "+d+" ngày ("+o.d2+")":d==0?"Dự kiến nhận hôm nay":"Quá hạn nhận "+(-d)+" ngày"}
function render(){
  load();
  var q=$("q").value.trim().toLowerCase();
  $("s1").textContent=orders.length;
  $("s2").textContent=orders.filter(function(o){return!o.done}).length;
  $("s3").textContent=money(orders.reduce(function(a,o){return a+Number(o.price||0)},0));
  var rows=orders.map(function(o,i){return{o:o,i:i}}).filter(function(x){
    var o=x.o;
    if(flt==1&&o.done)return false;if(flt==2&&!o.done)return false;
    return!q||[o.id,o.rn,o.sn,o.rp,o.sp,o.info].join(" ").toLowerCase().indexOf(q)>-1;
  });
  $("list").innerHTML=rows.length?rows.map(function(x){
    var o=x.o;
    return '<div class="card"><div class="head"><div><b>Mã hàng: '+o.id+'</b><small>'+esc(o.info)+'</small></div><span class="tag '+(o.done?'d':'w')+'">'+(o.done?'Đã nhận':'Đang giao')+'</span></div>'+
    '<div class="steps"><div class="st on lnk"><i>✓</i>Đã tạo đơn</div><div class="st on '+(o.done?'lnk':'')+'"><i>'+(o.done?'✓':'🚚')+'</i>Đang giao</div><div class="st '+(o.done?'on fin':'')+'"><i>'+(o.done?'✓':'')+'</i>Đã nhận</div></div>'+
    '<div class="eta">'+eta(o)+'</div>'+
    [["Người nhận",o.rn+" · "+o.rp],["Người gửi",o.sn+" · "+o.sp],["Địa chỉ gửi",o.sa],["Ngày tạo",o.d1],["Ngày nhận",o.d2],["Giá tiền",money(o.price)]].map(function(r){return '<div class="ln"><span>'+r[0]+'</span><span>'+esc(r[1])+'</span></div>'}).join("")+
    (o.done?'':'<button class="btn" onclick="done('+x.i+')">Xác nhận đã nhận đơn</button>')+'</div>';
  }).join(""):'<div class="empty">'+(orders.length?'Không tìm thấy đơn phù hợp':'Chưa có đơn nào. Hãy tạo đơn ở trang chính.')+'</div>';
}
function done(i){orders[i].done=true;save();render();alert("Thành công! Đơn "+orders[i].id+" đã được xác nhận.")}
window.addEventListener("focus",render);
render();
</script>
</body>
</html>
